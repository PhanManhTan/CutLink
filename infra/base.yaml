AWSTemplateFormatVersion: '2010-09-09'
Description: Cutlink network, database, edge, storage, roles and logs (demo environment)

Parameters:
  ProjectName:
    Type: String
    Default: cutlink
    AllowedPattern: '[a-z][a-z0-9-]{2,24}'
  DatabaseClass:
    Type: String
    Default: db.t4g.micro

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: !Ref ProjectName}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway}
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicA, RouteTableId: !Ref PublicRoutes}
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicB, RouteTableId: !Ref PublicRoutes}
  NatAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: {Domain: vpc}
  Nat:
    Type: AWS::EC2::NatGateway
    DependsOn: InternetRoute
    Properties: {SubnetId: !Ref PublicA, AllocationId: !GetAtt NatAddress.AllocationId}
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  NatRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRoutes
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref Nat
  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateA, RouteTableId: !Ref PrivateRoutes}
  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateB, RouteTableId: !Ref PrivateRoutes}

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP origin; listener also requires CloudFront secret
      VpcId: !Ref Vpc
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}]
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only ALB reaches the API; Redis stays inside the task
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSecurityGroup}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from ECS only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref TaskSecurityGroup}
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username":"cutlink"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString: {PasswordLength: 64, ExcludePunctuation: true}
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString: {PasswordLength: 48, ExcludePunctuation: true}
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Cutlink private database subnets
      SubnetIds: [!Ref PrivateA, !Ref PrivateB]
  Database:
    Type: AWS::RDS::DBInstance
    # RDS accepts a major-only version and selects a supported minor release.
    # https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/PostgreSQL.Concepts.General.DBVersions.html
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3691]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '17'
      DBInstanceClass: !Ref DatabaseClass
      DBName: cutlink
      MasterUsername: cutlink
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
  DatabaseSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DatabaseSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: [{Name: containerInsights, Value: disabled}]
  Logs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}
      RetentionInDays: 14
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs-and-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt Logs.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DatabaseSecret, !Ref JwtSecret]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicA, !Ref PublicB]
      SecurityGroups: [!Ref AlbSecurityGroup]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /api/health/ready
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '15'}]
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '403', ContentType: text/plain, MessageBody: Forbidden}
  OriginRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Cutlink-Origin
            Values: [!Sub '{{resolve:secretsmanager:${OriginSecret}:SecretString}}']
      Actions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-uncached
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  ApiRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub ${AWS::StackName}-api-viewer
        CookiesConfig: {CookieBehavior: all}
        QueryStringsConfig: {QueryStringBehavior: all}
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Origin, Content-Type, Access-Control-Request-Method, Access-Control-Request-Headers]
  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-spa
      AutoPublish: true
      FunctionConfig: {Comment: Rewrite frontend routes only; never API or redirect errors, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('.') === -1 || request.uri.endsWith('/')) {
            request.uri = '/index.html';
          }
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${ProjectName} HTTPS frontend and API
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccess
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: api
            DomainName: !GetAtt Alb.DNSName
            CustomOriginConfig: {HTTPPort: 80, OriginProtocolPolicy: http-only}
            OriginCustomHeaders:
              - HeaderName: X-Cutlink-Origin
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginSecret}:SecretString}}'
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed CachingOptimized: MinTTL=1. Use the custom policy below for index no-cache.
          CachePolicyId: !Ref StaticCachePolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiRequestPolicy
          - PathPattern: /r/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiRequestPolicy
  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-static
        DefaultTTL: 86400
        MinTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  VpcId: {Value: !Ref Vpc}
  PrivateSubnets: {Value: !Join [',', [!Ref PrivateA, !Ref PrivateB]], Export: {Name: !Sub '${AWS::StackName}-PrivateSubnets'}}
  TaskSecurityGroup: {Value: !Ref TaskSecurityGroup, Export: {Name: !Sub '${AWS::StackName}-TaskSecurityGroup'}}
  ClusterArn: {Value: !GetAtt Cluster.Arn, Export: {Name: !Sub '${AWS::StackName}-ClusterArn'}}
  ExecutionRoleArn: {Value: !GetAtt ExecutionRole.Arn, Export: {Name: !Sub '${AWS::StackName}-ExecutionRoleArn'}}
  TaskRoleArn: {Value: !GetAtt TaskRole.Arn, Export: {Name: !Sub '${AWS::StackName}-TaskRoleArn'}}
  DatabaseHost: {Value: !GetAtt Database.Endpoint.Address, Export: {Name: !Sub '${AWS::StackName}-DatabaseHost'}}
  DatabaseSecretArn: {Value: !Ref DatabaseSecret, Export: {Name: !Sub '${AWS::StackName}-DatabaseSecretArn'}}
  JwtSecretArn: {Value: !Ref JwtSecret, Export: {Name: !Sub '${AWS::StackName}-JwtSecretArn'}}
  LogGroup: {Value: !Ref Logs, Export: {Name: !Sub '${AWS::StackName}-LogGroup'}}
  TargetGroupArn: {Value: !Ref TargetGroup, Export: {Name: !Sub '${AWS::StackName}-TargetGroupArn'}}
  OriginRuleArn: {Value: !Ref OriginRule}
  FrontendBucket: {Value: !Ref FrontendBucket}
  DistributionId: {Value: !Ref Distribution}
  SiteUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
