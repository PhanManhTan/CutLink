name: CI / CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish backend image and upload frontend to S3 (main only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cutlink
          POSTGRES_PASSWORD: cutlink-local-only
          POSTGRES_DB: cutlink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cutlink -d cutlink_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 2s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cutlink:cutlink-local-only@localhost:5432/cutlink_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-only-never-use-in-production-12345
      COOKIE_SECURE: 'false'
      ALLOWED_ORIGINS: '["http://testserver"]'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Check Python
        run: .venv/bin/python -m ruff check app migrations tests ../scripts
      - name: PostgreSQL integration tests (migrations run twice)
        run: .venv/bin/python -m pytest -q --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-results-${{ matrix.python }}
          path: backend/test-results.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend / TypeScript + production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  infrastructure:
    name: CloudFormation + PowerShell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cfn-lint==1.60.1'
      - run: cfn-lint infra/base.yaml infra/app.yaml
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $parseErrors | Format-List | Out-Host; $failed = $true }
          }
          if ($failed) { throw 'PowerShell syntax check failed' }

  compose:
    name: Compose / migration gate + smoke + outages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure local environment
        run: cp .env.example .env
      - name: Build real application images
        run: docker compose build api frontend
      - name: Verify failed migration prevents API startup
        run: |
          if docker compose -f compose.yaml -f scripts/compose.migration-failure.yaml up -d api; then
            echo 'Expected startup to fail when migration fails'; exit 1
          fi
          if [ -n "$(docker compose ps --status running -q api)" ]; then
            echo 'API incorrectly started after a failed migration'; exit 1
          fi
          docker compose down
      - name: Start complete stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: HTTP smoke checks via frontend origin
        shell: pwsh
        run: ./scripts/smoke.ps1 -BaseUrl http://localhost:5173
      - name: Verify real worker and Beat process a click
        run: python scripts/check_background.py --base-url http://localhost:5173
      - name: Verify Redis and PostgreSQL outages and recovery
        run: python scripts/check_outages.py --base-url http://localhost:5173
      - name: Capture container state and logs
        if: always()
        run: |
          mkdir -p .deploy/ci
          docker compose ps -a > .deploy/ci/containers.txt
          docker compose logs --no-color > .deploy/ci/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-failure-logs
          path: .deploy/ci/
          retention-days: 7
      - name: Stop test stack
        if: always()
        run: docker compose down -v --remove-orphans

  publish_backend:
    name: CD / publish backend image to GHCR
    needs: [backend, frontend, infrastructure, compose]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend (API, worker, Beat and migration)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable backend image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > backend-image.txt
          printf 'Backend image: %s@%s\n\nECS deployment remains manual.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.txt

  publish_frontend:
    name: CD / upload frontend build to S3
    needs: [backend, frontend, infrastructure, compose]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # Finish an S3 index-last upload before starting another release, even across main pushes.
    concurrency:
      group: frontend-s3-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Validate AWS configuration
        shell: bash
        run: |
          for name in AWS_REGION AWS_ROLE_ARN FRONTEND_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Set production environment variable $name before publishing frontend."
              exit 1
            fi
          done
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: cutlink-frontend-${{ github.run_id }}
      - name: Upload hashed assets first and index last
        shell: bash
        run: |
          aws s3 sync frontend-dist/assets "s3://$FRONTEND_BUCKET/assets" --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          aws s3 cp frontend-dist/ "s3://$FRONTEND_BUCKET/" --recursive --exclude 'assets/*' --exclude 'index.html' --cache-control 'no-cache' --only-show-errors
          aws s3 cp frontend-dist/index.html "s3://$FRONTEND_BUCKET/index.html" --cache-control 'no-cache' --content-type 'text/html' --only-show-errors
      - name: Invalidate the CloudFront entry point
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        shell: bash
        run: |
          invalidation=$(aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/index.html' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$invalidation"
      - name: Record frontend publication
        run: printf 'Frontend build uploaded to s3://%s. Old hashed assets were retained.\n' "$FRONTEND_BUCKET" >> "$GITHUB_STEP_SUMMARY"
