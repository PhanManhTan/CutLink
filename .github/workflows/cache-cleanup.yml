name: Clean merged branch caches

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: merged-cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Default-branch script only: never check out or execute PR code.
      - uses: actions/github-script@v7
        with:
          script: |
            const merged = (await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'closed', base: 'main', per_page: 100
            })).filter(pr => pr.merged_at);
            const {data: repo} = await github.rest.repos.get(context.repo);
            const refs = new Set();
            for (const pr of merged) {
              refs.add(`refs/pull/${pr.number}/merge`);
              refs.add(`refs/pull/${pr.number}/head`);
              if (pr.head.repo?.id !== repo.id || pr.head.ref === 'main') continue;
              let current;
              try {
                current = (await github.rest.git.getRef({...context.repo, ref: `heads/${pr.head.ref}`})).data.object.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              // Preserve reused branches that have advanced since this PR merged.
              if (!current || current === pr.head.sha) refs.add(`refs/heads/${pr.head.ref}`);
            }
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              ...context.repo, per_page: 100
            });
            let removed = 0;
            for (const cache of caches) {
              if (!refs.has(cache.ref)) continue;
              await github.rest.actions.deleteActionsCacheById({...context.repo, cache_id: cache.id});
              removed++;
            }
            await core.summary.addRaw(`Removed ${removed} caches from merged PRs/branches. Main and active branch caches retained.`).write();
